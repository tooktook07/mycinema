services:
  web:
    image: node:22
    working_dir: /app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
